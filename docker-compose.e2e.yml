# End-to-end overlay: the AI provider becomes e2e/ai-stub, so the Playwright suite runs the
# whole stack with deterministic answers, no network and no key.
#
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
#   cd e2e && npx playwright test

services:
  ai-stub:
    build:
      context: ./e2e/ai-stub
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    networks:
      - internal

  api:
    environment:
      # A day of suite runs against one stack would otherwise spend these. The stub costs
      # nothing, and the suite uploads far more than any visitor would.
      AI_DAILY_CALL_LIMIT: 1000000
      UPLOAD_DAILY_LIMIT: 1000000

  web:
    environment:
      OPENAI_API_KEY: stub
      OPENAI_BASE_URL: http://ai-stub:8787/v1
      # The suite shares one client address, so the AI and write limits are sized for a whole
      # run. The rate-limit spec drains the render limit on purpose; it resets with the next
      # 60 s window, so the suite can run again without restarting anything.
      RATE_LIMIT_AI_CLIENT_LIMIT: 400
      RATE_LIMIT_AI_GLOBAL_LIMIT: 800
      RATE_LIMIT_WRITE_CLIENT_LIMIT: 400
      RATE_LIMIT_WRITE_GLOBAL_LIMIT: 800
      RATE_LIMIT_RENDER_CLIENT_LIMIT: 40
    depends_on:
      ai-stub:
        condition: service_healthy
