# The Cloud Run service: one instance holds web (the only container with a port) and api (a
# sidecar web reaches on localhost:8080). The database is Neon, outside Google Cloud.
#
# deploy.sh fills in the placeholders: ${PROJECT_ID} (the Google Cloud project), ${REGION}
# (us-east4, next to Neon's aws-us-east-1) and ${TAG} (the git commit the images were built
# from). docs/deploy-cloud-run.md is the one-time setup this file assumes.
#
# There is no Caddy here. Google's front end terminates TLS and appends the client address to
# X-Forwarded-For (web reads it from the right; TRUSTED_PROXY_HOPS), .app domains are HSTS
# preloaded, and the api's multipart limit caps upload size.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: plotlineai
  labels:
    cloud.googleapis.com/location: ${REGION}
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Scale to zero when idle, which is what keeps this inside the free tier.
        autoscaling.knative.dev/minScale: "0"
        # An invariant, not a tuning knob: web's rate limiters live in memory and are only
        # correct for one instance. It also bounds the worst-case bill.
        autoscaling.knative.dev/maxScale: "1"
        # Request-based billing: CPU (and cost) only while a request is being handled.
        run.googleapis.com/cpu-throttling: "true"
        # Extra CPU while the JVM and Next start, to shorten the cold start.
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/execution-environment: gen2
        # web starts only once api's startup probe passes.
        run.googleapis.com/container-dependencies: '{"web":["api"]}'
    spec:
      serviceAccountName: plotlineai-runtime@${PROJECT_ID}.iam.gserviceaccount.com
      timeoutSeconds: 60
      containers:
        - name: web
          image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/plotlineai/web:${TAG}
          ports:
            - containerPort: 3000
          resources:
            limits:
              # Fractional CPU would force one request at a time and the gen1 runtime.
              cpu: "1"
              memory: 512Mi
          env:
            - name: TRUSTED_PROXY_HOPS
              value: "1"
            - name: AI_MODEL
              value: gpt-5-nano
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-api-key
                  key: latest
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 2
            failureThreshold: 30
        - name: api
          image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/plotlineai/api:${TAG}
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: db-url
                  key: latest
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-user
                  key: latest
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-password
                  key: latest
            # A small pool with no idle connections and no keepalive, so Neon can suspend
            # when nobody is using the app instead of burning its compute allowance.
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "4"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "0"
            - name: SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME
              value: "0"
            # A dataset only matters during one analyze session; shares keep their own copy.
            - name: DATASET_TTL
              value: PT24H
            # 300 MB, inside Neon's free 0.5 GB with room for shares and the gallery.
            - name: DATASET_MAX_TOTAL_BYTES
              value: "314572800"
            - name: AI_DAILY_CALL_LIMIT
              value: "500"
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 40
