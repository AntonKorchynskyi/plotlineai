spring:
  application:
    name: backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true

plotlineai:
  aws:
    region: ${AWS_REGION:us-east-1}
    # Blank on AWS. Compose and the tests point these at DynamoDB Local and S3Mock.
    dynamodb-endpoint: ${PLOTLINEAI_DYNAMODB_ENDPOINT:}
    s3-endpoint: ${PLOTLINEAI_S3_ENDPOINT:}
    s3-public-endpoint: ${PLOTLINEAI_S3_PUBLIC_ENDPOINT:}
    app-table: ${PLOTLINEAI_APP_TABLE:plotlineai-app}
    data-bucket: ${PLOTLINEAI_DATA_BUCKET:plotlineai-data}
  dataset:
    max-file-bytes: ${DATASET_MAX_FILE_BYTES:5242880}
    max-rows: ${DATASET_MAX_ROWS:100000}
    max-columns: ${DATASET_MAX_COLUMNS:256}
    max-cell-chars: ${DATASET_MAX_CELL_CHARS:32768}
    ttl: ${DATASET_TTL:P7D}
    sample-rows: ${DATASET_SAMPLE_ROWS:20}
    # Uploads the whole service accepts per UTC day: the bound on S3 storage.
    upload-daily-limit: ${UPLOAD_DAILY_LIMIT:300}
  ai:
    # Provider calls allowed per UTC day, across all clients. web asks before each call.
    daily-call-limit: ${AI_DAILY_CALL_LIMIT:500}

# Actuator lives on its own port. The compose healthcheck reaches it from inside the container,
# and web only ever forwards to 8080. Lambda sets MANAGEMENT_PORT=-1: no actuator over HTTP there.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080
  # Spring's defaults already hide these; spelled out so a later change cannot leak them.
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false
