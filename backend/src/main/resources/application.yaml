spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/plotlineai}
    username: ${SPRING_DATASOURCE_USERNAME:plotlineai}
    password: ${SPRING_DATASOURCE_PASSWORD:plotlineai}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

plotlineai:
  dataset:
    max-file-bytes: ${DATASET_MAX_FILE_BYTES:5242880}
    max-rows: ${DATASET_MAX_ROWS:100000}
    max-columns: ${DATASET_MAX_COLUMNS:256}
    max-cell-chars: ${DATASET_MAX_CELL_CHARS:32768}
    ttl: ${DATASET_TTL:P7D}
    sample-rows: ${DATASET_SAMPLE_ROWS:20}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080
