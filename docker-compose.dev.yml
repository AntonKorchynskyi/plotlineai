# Dev overlay: publishes the local AWS stand-ins on the host, for running the backend or
# frontend outside Docker. Use explicitly:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d dynamodb s3 aws-init
# then point the api at them: PLOTLINEAI_DYNAMODB_ENDPOINT=http://localhost:8000,
# PLOTLINEAI_S3_ENDPOINT=http://localhost:9090, and any AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY.
services:
  dynamodb:
    ports:
      - "8000:8000"
  s3:
    ports:
      - "9090:9090"
