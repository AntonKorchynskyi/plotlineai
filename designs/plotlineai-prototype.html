document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"0de1b915-d7b0-4632-9bdc-62e707c87b3b\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"aac19d9c-1dfe-4462-8817-56dda7492558\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"0de1b915-d7b0-4632-9bdc-62e707c87b3b\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"aac19d9c-1dfe-4462-8817-56dda7492558\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f5ead8;\n  --color-surface: #ebddc5;\n  --color-text: #201e1d;\n  --color-accent: #c67139;\n  --color-accent-2: #7a8a5e;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f9f4ed;\n  --color-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 999px; }\n.input { padding-inline: 14px; }\n\n<\u002Fstyle>\n<script src=\"06bae9b6-9293-4cff-a63c-1d1bb7a28b5a\"><\u002Fscript>\n<script src=\"7ab86ad0-ae70-498e-b621-fb2ebae47b94\"><\u002Fscript>\n<style>\n  body { margin: 0; }\n  a { color: var(--color-accent-700); }\n  a:hover { color: var(--color-accent-600); }\n  .btn, .tag { white-space: nowrap; }\n  @keyframes plShimmer { 0% { opacity: .45 } 50% { opacity: .9 } 100% { opacity: .45 } }\n  @keyframes plSpin { to { transform: rotate(360deg) } }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height: 100vh; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body);\">\n\n  <div class=\"nav\" style=\"max-width: 1120px; margin: 0 auto; padding: 22px 26px 6px;\">\n    <span class=\"nav-brand\" style=\"display: flex; align-items: center; gap: 10px;\">\n      <span style=\"width: 26px; height: 26px; border-radius: 999px; background: var(--color-accent); display: inline-flex; align-items: center; justify-content: center;\">\n        <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#f5ead8\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 3v18h18\"><\u002Fpath><path d=\"M7 15l4-5 3 3 4-6\"><\u002Fpath><\u002Fsvg>\n      <\u002Fspan>\n      PlotlineAI\n    <\u002Fspan>\n    <a href=\"#\" sc-camel-on-click=\"{{ goLanding }}\">Home<\u002Fa>\n    <a href=\"#\" sc-camel-on-click=\"{{ goUpload }}\">Analyze<\u002Fa>\n  <\u002Fdiv>\n\n  <div style=\"max-width: 1120px; margin: 0 auto; padding: 0 26px;\">\n    <div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 0 26px; border-bottom: 1px solid var(--color-divider);\">\n      <span style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-right: 4px;\">Screens<\u002Fspan>\n      <sc-for list=\"{{ screenTabs }}\" as=\"tab\" hint-placeholder-count=\"9\">\n        <button class=\"btn\" style=\"{{ tab.style }}\" sc-camel-on-click=\"{{ tab.go }}\">{{ tab.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isLanding }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 48px 26px 96px;\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 52px; align-items: center;\">\n        <div>\n          <span class=\"tag tag-accent\" style=\"margin-bottom: 20px;\">CSV in, chart out<\u002Fspan>\n          <h1 style=\"font-size: 54px; line-height: 1.08; margin: 0 0 18px; max-width: 13em;\">Hand it a spreadsheet. Get the chart you meant to make.<\u002Fh1>\n          <p style=\"font-size: 18px; line-height: 1.6; max-width: 34em; margin: 0 0 28px; color: color-mix(in srgb, var(--color-text) 78%, transparent);\">Upload a CSV and an AI agent reads the column types, picks the three charts worth looking at, and explains why. The numbers are aggregated on the server against your whole file, so what you see is the real data, not a sample.<\u002Fp>\n          <div style=\"display: flex; gap: 12px; flex-wrap: wrap;\">\n            <button class=\"btn btn-primary\" style=\"padding: 12px 24px; font-size: 15px;\" sc-camel-on-click=\"{{ goUpload }}\">\n              Upload a CSV\n              <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M12 5l7 7-7 7\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n            <a class=\"btn btn-secondary\" style=\"padding: 12px 24px; font-size: 15px;\" href=\"#gallery\">See six examples<\u002Fa>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 26px; flex-wrap: wrap; margin-top: 36px; font-size: 13px; white-space: nowrap; color: color-mix(in srgb, var(--color-text) 62%, transparent);\">\n            <span>5 MB · 100k rows<\u002Fspan>\n            <span>Files expire after 7 days<\u002Fspan>\n            <span>PNG export and share links<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position: relative;\">\n          <div style=\"position: absolute; width: 230px; height: 230px; border-radius: 999px; background: var(--color-accent-2-200); right: -34px; top: -46px;\"><\u002Fdiv>\n          <div style=\"position: absolute; width: 120px; height: 120px; border-radius: 999px; background: var(--color-accent-200); left: -40px; bottom: -34px;\"><\u002Fdiv>\n          <div class=\"card elev-md\" style=\"position: relative; padding: 24px;\">\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px;\">\n              <span class=\"card-kicker\">Rendered from monthly-signups.csv<\u002Fspan>\n              <span class=\"tag tag-neutral\">line<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"card-title\" style=\"font-size: 20px;\">Signups per month<\u002Fdiv>\n            <div style=\"position: relative; height: 240px; margin-top: 8px;\"><canvas ref=\"{{ heroChart }}\"><\u002Fcanvas><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"gallery\" style=\"margin-top: 104px;\">\n        <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 28px;\">\n          <div>\n            <h2 style=\"font-size: 34px; margin: 0 0 8px;\">Six charts, six CSVs<\u002Fh2>\n            <p style=\"margin: 0; font-size: 15px; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">Every example below was rendered by the same pipeline your upload goes through. Take the CSV and try it yourself.<\u002Fp>\n          <\u002Fdiv>\n          <span class=\"tag tag-outline\">GET /api/backend/gallery<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: {{ galleryTracks }}; gap: 26px;\">\n          <sc-for list=\"{{ gallery }}\" as=\"item\" hint-placeholder-count=\"6\">\n            <div class=\"card elev-sm\" style=\"padding: 20px; gap: 12px;\">\n              <div style=\"position: relative; height: 240px; border-radius: 22px; background: var(--color-bg); padding: 12px;\"><canvas ref=\"{{ item.chart }}\"><\u002Fcanvas><\u002Fdiv>\n              <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px;\">\n                <span class=\"card-title\">{{ item.title }}<\u002Fspan>\n                <span class=\"tag tag-neutral\">{{ item.type }}<\u002Fspan>\n              <\u002Fdiv>\n              <p class=\"card-body\" style=\"font-size: 13.5px;\">{{ item.desc }}<\u002Fp>\n              <div style=\"display: flex; align-items: center; gap: 8px; margin-top: 2px;\">\n                <button class=\"btn btn-ghost\" style=\"font-size: 13px;\">\n                  <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"><\u002Fpath><path d=\"M7 10l5 5 5-5\"><\u002Fpath><path d=\"M12 15V3\"><\u002Fpath><\u002Fsvg>\n                  Download CSV\n                <\u002Fbutton>\n                <button class=\"btn btn-ghost\" style=\"font-size: 13px; margin-left: auto;\" sc-camel-on-click=\"{{ goUpload }}\">Try your own<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isUpload }}\">\n    <div style=\"max-width: 760px; margin: 0 auto; padding: 64px 26px 120px;\">\n      <h2 style=\"font-size: 36px; margin: 0 0 10px;\">Start with a CSV<\u002Fh2>\n      <p style=\"margin: 0 0 32px; font-size: 16px; color: color-mix(in srgb, var(--color-text) 72%, transparent);\">One file, comma separated, with a header row. Nothing is stored beyond seven days.<\u002Fp>\n      <div class=\"card elev-md\" style=\"padding: 12px;\">\n        <button style=\"border: 2px dashed color-mix(in srgb, var(--color-accent) 45%, transparent); background: var(--color-accent-100); border-radius: 30px; padding: 58px 32px; display: flex; flex-direction: column; align-items: center; gap: 14px; cursor: pointer; width: 100%; font-family: var(--font-body); color: var(--color-text);\" sc-camel-on-click=\"{{ startUpload }}\">\n          <span style=\"width: 58px; height: 58px; border-radius: 999px; background: var(--color-accent); display: inline-flex; align-items: center; justify-content: center;\">\n            <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#f5ead8\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"><\u002Fpath><path d=\"M17 8l-5-5-5 5\"><\u002Fpath><path d=\"M12 3v12\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n          <span style=\"font-family: var(--font-heading); font-size: 21px;\">Drop a CSV here<\u002Fspan>\n          <span style=\"font-size: 14px; color: color-mix(in srgb, var(--color-text) 65%, transparent);\">or click to browse · up to 5 MB and 100,000 rows<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 26px;\">\n        <span style=\"font-size: 13px; color: color-mix(in srgb, var(--color-text) 60%, transparent);\">No file handy?<\u002Fspan>\n        <button class=\"btn btn-secondary\" style=\"font-size: 13px;\" sc-camel-on-click=\"{{ startUpload }}\">Use revenue-by-region.csv<\u002Fbutton>\n        <button class=\"btn btn-secondary\" style=\"font-size: 13px;\" sc-camel-on-click=\"{{ goRejected }}\">Use exports-q4.xlsx<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"margin-top: 44px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px;\">\n        <div>\n          <div style=\"font-family: var(--font-heading); font-size: 17px; margin-bottom: 6px;\">1. Parse<\u002Fdiv>\n          <p style=\"margin: 0; font-size: 13.5px; color: color-mix(in srgb, var(--color-text) 68%, transparent);\">The Java service streams your file, infers each column's type and counts distinct values.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family: var(--font-heading); font-size: 17px; margin-bottom: 6px;\">2. Suggest<\u002Fdiv>\n          <p style=\"margin: 0; font-size: 13.5px; color: color-mix(in srgb, var(--color-text) 68%, transparent);\">The agent sees the schema and twenty sample rows, never the whole file, and returns three chart specs.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family: var(--font-heading); font-size: 17px; margin-bottom: 6px;\">3. Render<\u002Fdiv>\n          <p style=\"margin: 0; font-size: 13.5px; color: color-mix(in srgb, var(--color-text) 68%, transparent);\">Each spec is checked against the real schema, then aggregated over every row before it is drawn.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isParsing }}\">\n    <div style=\"max-width: 760px; margin: 0 auto; padding: 96px 26px 140px; text-align: center;\">\n      <span style=\"width: 54px; height: 54px; border-radius: 999px; border: 4px solid var(--color-accent-200); border-top-color: var(--color-accent); display: inline-block; animation: plSpin 900ms linear infinite;\"><\u002Fspan>\n      <h2 style=\"font-size: 30px; margin: 26px 0 8px;\">Parsing revenue-by-region.csv<\u002Fh2>\n      <p style=\"margin: 0 0 34px; font-size: 15px; color: color-mix(in srgb, var(--color-text) 68%, transparent);\">Streaming rows, inferring column types.<\u002Fp>\n      <div class=\"card elev-sm\" style=\"padding: 22px; text-align: left; gap: 14px;\">\n        <div style=\"height: 14px; width: 42%; border-radius: 999px; background: var(--color-accent-200); animation: plShimmer 1.4s ease-in-out infinite;\"><\u002Fdiv>\n        <div style=\"height: 14px; width: 78%; border-radius: 999px; background: var(--color-neutral-200); animation: plShimmer 1.4s ease-in-out infinite 120ms;\"><\u002Fdiv>\n        <div style=\"height: 14px; width: 61%; border-radius: 999px; background: var(--color-neutral-200); animation: plShimmer 1.4s ease-in-out infinite 240ms;\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isThinking }}\">\n    <div style=\"max-width: 1040px; margin: 0 auto; padding: 64px 26px 120px;\">\n      <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 10px;\">\n        <span style=\"width: 22px; height: 22px; border-radius: 999px; border: 3px solid var(--color-accent-200); border-top-color: var(--color-accent); display: inline-block; animation: plSpin 900ms linear infinite;\"><\u002Fspan>\n        <h2 style=\"font-size: 30px; margin: 0;\">Reading your columns<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin: 0 0 32px; font-size: 15px; color: color-mix(in srgb, var(--color-text) 68%, transparent);\">One structured call, usually under three seconds.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px;\">\n        <div class=\"card elev-sm\" style=\"padding: 22px; gap: 14px;\">\n          <div style=\"height: 16px; width: 55%; border-radius: 999px; background: var(--color-accent-200); animation: plShimmer 1.4s ease-in-out infinite;\"><\u002Fdiv>\n          <div style=\"height: 12px; width: 92%; border-radius: 999px; background: var(--color-neutral-200); animation: plShimmer 1.4s ease-in-out infinite 100ms;\"><\u002Fdiv>\n          <div style=\"height: 12px; width: 70%; border-radius: 999px; background: var(--color-neutral-200); animation: plShimmer 1.4s ease-in-out infinite 200ms;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card elev-sm\" style=\"padding: 22px; gap: 14px;\">\n          <div style=\"height: 16px; width: 62%; border-radius: 999px; background: var(--color-accent-200); animation: plShimmer 1.4s ease-in-out infinite 160ms;\"><\u002Fdiv>\n          <div style=\"height: 12px; width: 88%; border-radius: 999px; background: var(--color-neutral-200); animation: plShimmer 1.4s ease-in-out infinite 260ms;\"><\u002Fdiv>\n          <div style=\"height: 12px; width: 64%; border-radius: 999px; background: var(--color-neutral-200); animation: plShimmer 1.4s ease-in-out infinite 360ms;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card elev-sm\" style=\"padding: 22px; gap: 14px;\">\n          <div style=\"height: 16px; width: 48%; border-radius: 999px; background: var(--color-accent-200); animation: plShimmer 1.4s ease-in-out infinite 320ms;\"><\u002Fdiv>\n          <div style=\"height: 12px; width: 84%; border-radius: 999px; background: var(--color-neutral-200); animation: plShimmer 1.4s ease-in-out infinite 420ms;\"><\u002Fdiv>\n          <div style=\"height: 12px; width: 72%; border-radius: 999px; background: var(--color-neutral-200); animation: plShimmer 1.4s ease-in-out infinite 520ms;\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isSuggestions }}\">\n    <div style=\"max-width: 1040px; margin: 0 auto; padding: 56px 26px 120px;\">\n      <div class=\"card elev-sm\" style=\"padding: 20px 24px; margin-bottom: 40px; gap: 12px;\">\n        <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap;\">\n          <span style=\"width: 34px; height: 34px; border-radius: 999px; background: var(--color-accent-2-200); display: inline-flex; align-items: center; justify-content: center;\">\n            <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3d472b\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n          <span style=\"font-family: var(--font-heading); font-size: 19px;\">revenue-by-region.csv<\u002Fspan>\n          <span class=\"tag tag-neutral\">12 rows<\u002Fspan>\n          <span class=\"tag tag-neutral\">3 columns<\u002Fspan>\n          <span class=\"tag tag-neutral\">0 nulls<\u002Fspan>\n          <button class=\"btn btn-ghost\" style=\"margin-left: auto; font-size: 13px;\" sc-camel-on-click=\"{{ goUpload }}\">Replace file<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 10px; flex-wrap: wrap;\">\n          <span class=\"tag tag-accent-2\">region · string · 5 distinct<\u002Fspan>\n          <span class=\"tag tag-accent-2\">rep · string · 12 distinct<\u002Fspan>\n          <span class=\"tag tag-accent-2\">revenue · integer · 47,200–154,600<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h2 style=\"font-size: 34px; margin: 0 0 8px;\">Three charts worth a look<\u002Fh2>\n      <p style=\"margin: 0 0 28px; font-size: 15px; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">Pick one to render it over all twelve rows, or describe the chart you had in mind.<\u002Fp>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px;\">\n        <sc-for list=\"{{ suggestions }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <button class=\"card elev-sm\" style=\"padding: 22px; gap: 12px; text-align: left; border: 1px solid transparent; cursor: pointer; font-family: var(--font-body); color: var(--color-text);\" style-hover=\"border-color: var(--color-accent); box-shadow: var(--shadow-md);\" sc-camel-on-click=\"{{ s.go }}\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px;\">\n              <span class=\"card-kicker\">Suggestion {{ s.n }}<\u002Fspan>\n              <span class=\"tag tag-accent\">{{ s.type }}<\u002Fspan>\n            <\u002Fdiv>\n            <span class=\"card-title\" style=\"font-size: 19px;\">{{ s.title }}<\u002Fspan>\n            <p class=\"card-body\" style=\"font-size: 13.5px;\">{{ s.why }}<\u002Fp>\n            <div style=\"position: relative; height: 104px; border-radius: 18px; background: var(--color-bg); padding: 8px; margin-top: 4px;\"><canvas ref=\"{{ s.chart }}\"><\u002Fcanvas><\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div class=\"card elev-sm\" style=\"padding: 22px 24px; margin-top: 26px; gap: 14px;\">\n        <span style=\"font-family: var(--font-heading); font-size: 18px;\">Or describe it yourself<\u002Fspan>\n        <div style=\"display: flex; gap: 10px; flex-wrap: wrap;\">\n          <input class=\"input\" style=\"flex: 1; min-width: 240px; min-height: 44px;\" placeholder=\"e.g. revenue by region as a doughnut, biggest first\">\n          <button class=\"btn btn-primary\" style=\"padding: 11px 22px;\" sc-camel-on-click=\"{{ goThinking }}\">Draw it<\u002Fbutton>\n        <\u002Fdiv>\n        <span style=\"font-size: 12.5px; color: color-mix(in srgb, var(--color-text) 58%, transparent);\">500 characters max. Column names and cell values are treated as data, never as instructions.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isChart }}\">\n    <div style=\"max-width: 1040px; margin: 0 auto; padding: 56px 26px 120px;\">\n      <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 22px;\">\n        <div>\n          <span class=\"card-kicker\">revenue-by-region.csv · 12 rows aggregated<\u002Fspan>\n          <h2 style=\"font-size: 34px; margin: 6px 0 0;\">{{ chartTitle }}<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 10px; flex-wrap: wrap;\">\n          <button class=\"btn btn-secondary\" style=\"font-size: 14px;\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"><\u002Fpath><path d=\"M7 10l5 5 5-5\"><\u002Fpath><path d=\"M12 15V3\"><\u002Fpath><\u002Fsvg>\n            Download PNG\n          <\u002Fbutton>\n          <button class=\"btn btn-primary\" style=\"font-size: 14px;\" sc-camel-on-click=\"{{ goShared }}\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7.07 0l3-3A5 5 0 0 0 13 3l-1.5 1.5\"><\u002Fpath><path d=\"M14 11a5 5 0 0 0-7.07 0l-3 3A5 5 0 0 0 11 21l1.5-1.5\"><\u002Fpath><\u002Fsvg>\n            Share\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card elev-md\" style=\"padding: 26px;\">\n        <div style=\"position: relative; height: 400px;\"><canvas ref=\"{{ mainChart }}\"><\u002Fcanvas><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px; margin-top: 22px;\">\n        <div class=\"card elev-sm\" style=\"padding: 22px 24px; gap: 14px;\">\n          <span style=\"font-family: var(--font-heading); font-size: 18px;\">Refine it<\u002Fspan>\n          <div style=\"display: flex; gap: 10px; flex-wrap: wrap;\">\n            <input class=\"input\" style=\"flex: 1; min-width: 220px; min-height: 44px;\" placeholder=\"make it a doughnut, top five only…\">\n            <button class=\"btn btn-primary\" style=\"padding: 11px 22px;\" sc-camel-on-click=\"{{ nextSpec }}\">Send<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 8px; flex-wrap: wrap;\">\n            <sc-for list=\"{{ refineChips }}\" as=\"c\" hint-placeholder-count=\"4\">\n              <button class=\"btn btn-secondary\" style=\"font-size: 13px;\" sc-camel-on-click=\"{{ c.go }}\">{{ c.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card elev-sm\" style=\"padding: 22px 24px; gap: 10px; background: var(--color-neutral-100);\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px;\">\n            <span style=\"font-family: var(--font-heading); font-size: 18px;\">ChartSpec<\u002Fspan>\n            <span class=\"tag tag-accent-2\">validated<\u002Fspan>\n          <\u002Fdiv>\n          <pre style=\"margin: 0; font-size: 12px; line-height: 1.6; font-family: ui-monospace, monospace; white-space: pre-wrap; color: color-mix(in srgb, var(--color-text) 80%, transparent);\">{{ specJson }}<\u002Fpre>\n          <span style=\"font-size: 12px; color: color-mix(in srgb, var(--color-text) 58%, transparent);\">Every column checked against the stored schema before rendering.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isShared }}\">\n    <div style=\"max-width: 880px; margin: 0 auto; padding: 56px 26px 120px;\">\n      <div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;\">\n        <span class=\"tag tag-accent\">Read only<\u002Fspan>\n        <span style=\"font-size: 13px; font-family: ui-monospace, monospace; color: color-mix(in srgb, var(--color-text) 62%, transparent);\">plotlineai.app/s/8f3c1a7e<\u002Fspan>\n      <\u002Fdiv>\n      <h2 style=\"font-size: 34px; margin: 0 0 6px;\">{{ chartTitle }}<\u002Fh2>\n      <p style=\"margin: 0 0 24px; font-size: 14px; color: color-mix(in srgb, var(--color-text) 65%, transparent);\">Shared 17 September 2026 · a snapshot of the rendered numbers, so this link keeps working after the dataset expires.<\u002Fp>\n      <div class=\"card elev-md\" style=\"padding: 26px;\">\n        <div style=\"position: relative; height: 380px;\"><canvas ref=\"{{ shareChart }}\"><\u002Fcanvas><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card elev-sm\" style=\"padding: 22px 24px; margin-top: 22px; flex-direction: row; align-items: center; gap: 18px; flex-wrap: wrap;\">\n        <span style=\"font-family: var(--font-heading); font-size: 19px;\">Got a CSV of your own?<\u002Fspan>\n        <button class=\"btn btn-primary\" style=\"margin-left: auto; padding: 11px 22px;\" sc-camel-on-click=\"{{ goUpload }}\">Make your own chart<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isRejected }}\">\n    <div style=\"max-width: 680px; margin: 0 auto; padding: 88px 26px 140px;\">\n      <div class=\"card elev-md\" style=\"padding: 32px; gap: 16px;\">\n        <span style=\"width: 52px; height: 52px; border-radius: 999px; background: var(--color-accent-200); display: inline-flex; align-items: center; justify-content: center;\">\n          <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8c491a\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"><\u002Fpath><path d=\"M12 9v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n        <h2 style=\"font-size: 30px; margin: 0;\">That file was not a CSV<\u002Fh2>\n        <p style=\"margin: 0; font-size: 15px; color: color-mix(in srgb, var(--color-text) 74%, transparent);\">Only comma separated values can be read. Export your file as a CSV and try again.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; color: color-mix(in srgb, var(--color-text) 66%, transparent);\">\n          <span>· .csv extension and text/csv content type<\u002Fspan>\n          <span>· 5 MB, 100,000 rows, 256 columns<\u002Fspan>\n          <span>· UTF-8 text with one header row<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px;\">\n          <button class=\"btn btn-primary\" style=\"padding: 11px 22px;\" sc-camel-on-click=\"{{ goUpload }}\">Pick another file<\u002Fbutton>\n          <button class=\"btn btn-secondary\" style=\"padding: 11px 22px;\" sc-camel-on-click=\"{{ goLanding }}\">Browse the examples<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isEmpty }}\">\n    <div style=\"max-width: 880px; margin: 0 auto; padding: 56px 26px 120px;\">\n      <div style=\"margin-bottom: 22px;\">\n        <span class=\"card-kicker\">revenue-by-region.csv · 12 rows aggregated<\u002Fspan>\n        <h2 style=\"font-size: 34px; margin: 6px 0 0;\">Revenue by region, Middle East only, above 100k<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"card elev-md\" style=\"padding: 56px 32px; align-items: center; text-align: center; gap: 14px;\">\n        <span style=\"width: 96px; height: 96px; border-radius: 999px; background: var(--color-accent-2-200); display: inline-flex; align-items: center; justify-content: center;\">\n          <svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3d472b\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 3v18h18\"><\u002Fpath><path d=\"M7 16h.01\"><\u002Fpath><path d=\"M12 16h.01\"><\u002Fpath><path d=\"M17 16h.01\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n        <span style=\"font-family: var(--font-heading); font-size: 24px;\">Nothing left to plot<\u002Fspan>\n        <p style=\"margin: 0; max-width: 34em; font-size: 15px; color: color-mix(in srgb, var(--color-text) 72%, transparent);\">The filters matched no rows. The Middle East region tops out at 47,200, so the 100k floor removes everything.<\u002Fp>\n        <div style=\"display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px;\">\n          <button class=\"btn btn-secondary\" style=\"padding: 11px 22px;\" sc-camel-on-click=\"{{ goChart }}\">Drop the filters<\u002Fbutton>\n          <button class=\"btn btn-ghost\" style=\"padding: 11px 16px;\" sc-camel-on-click=\"{{ goSuggestions }}\">Back to suggestions<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showScreenBar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;demoDelay&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1400,&quot;min&quot;:0,&quot;max&quot;:4000,&quot;step&quot;:100,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;galleryColumns&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:2,&quot;max&quot;:3,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Landing&quot;}}\">\nclass Component extends DCLogic {\n  state = { screen: 'landing', spec: 'byRegion' };\n\n  ink = '#201e1d';\n  palette = ['#c67139', '#8fa073', '#8c491a', '#aebf92', '#f6a06b', '#56633f'];\n\n  csv = {\n    revenue: `region,rep,revenue\nNorth America,A. Rivera,128400\nNorth America,J. Chen,96750\nNorth America,M. Osei,141200\nEurope,L. Novak,88300\nEurope,S. Dubois,112900\nEurope,K. Andersson,73450\nAsia Pacific,H. Tanaka,154600\nAsia Pacific,P. Sharma,98200\nAsia Pacific,W. Lim,86750\nLatin America,C. Duarte,61300\nLatin America,F. Molina,54800\nMiddle East,N. Haddad,47200`,\n    signups: `date,signups\n2024-01-08,142\n2024-01-22,168\n2024-02-05,187\n2024-02-19,203\n2024-03-04,229\n2024-03-18,241\n2024-04-01,268\n2024-04-15,254\n2024-05-06,301\n2024-05-20,318\n2024-06-03,342\n2024-06-17,336\n2024-07-01,389\n2024-07-15,401\n2024-08-05,438\n2024-08-19,455\n2024-09-02,472\n2024-09-16,498\n2024-10-07,523\n2024-10-21,541\n2024-11-04,567\n2024-11-18,589`,\n    traffic: `source,sessions\nOrganic search,48200\nDirect,21450\nReferral,12800\nSocial,9640\nEmail,7320\nPaid search,5180`,\n    sales: `date,category,sales\n2024-01-18,Hardware,84200\n2024-02-12,Hardware,79800\n2024-04-09,Hardware,91500\n2024-05-21,Hardware,88100\n2024-07-15,Hardware,96300\n2024-08-27,Hardware,102400\n2024-10-11,Hardware,108900\n2024-11-19,Hardware,114700\n2024-01-25,Software,62100\n2024-02-28,Software,68400\n2024-04-16,Software,71900\n2024-05-30,Software,77200\n2024-07-22,Software,83600\n2024-08-14,Software,89100\n2024-10-03,Software,94800\n2024-11-26,Software,101300\n2024-01-09,Services,38700\n2024-02-20,Services,41200\n2024-04-24,Services,44600\n2024-05-08,Services,47300\n2024-07-02,Services,50900\n2024-08-06,Services,53400\n2024-10-29,Services,57800\n2024-11-05,Services,61200`,\n    price: `product,price,rating\nAurora Stand,24.99,3.8\nBasalt Mount,31.5,4.1\nCirrus Hub,45,4.3\nDelta Grip,18.75,3.4\nEmber Dock,52.4,4.5\nFlint Case,12.99,3.1\nGranite Arm,68.9,4.6\nHarbor Pad,27.3,3.9\nIonic Cable,9.5,2.9\nJuniper Tray,38.2,4\nKestrel Riser,57.75,4.4\nLumen Lamp,74.5,4.7\nMeridian Rack,41.6,4.2\nNimbus Sleeve,15.25,3.3\nOnyx Clamp,63.4,4.5\nPrairie Shelf,29.99,3.7\nQuartz Base,49.8,4.3\nRidge Holder,21.4,3.5\nSummit Frame,82.3,4.8\nTundra Wrap,13.6,3`,\n    city: `city,area_km2,population_k,density_per_km2\nBarcelona,101,1620,16040\nVienna,415,1930,4651\nLisbon,100,545,5450\nCopenhagen,180,650,3611\nMunich,311,1490,4791\nPrague,496,1310,2641\nAmsterdam,219,905,4132\nStockholm,188,980,5213\nDublin,115,595,5174\nHelsinki,215,660,3070\nWarsaw,517,1790,3462\nBudapest,525,1680,3200\nPorto,41,231,5634\nRotterdam,324,655,2021`\n  };\n\n  parse(text) {\n    const lines = text.trim().split('\\n');\n    const cols = lines[0].split(',');\n    return lines.slice(1).map(line => {\n      const cells = line.split(',');\n      const row = {};\n      cols.forEach((c, i) => { row[c] = cells[i]; });\n      return row;\n    });\n  }\n\n  sumBy(rows, key, measure) {\n    const totals = new Map();\n    rows.forEach(r => totals.set(r[key], (totals.get(r[key]) || 0) + Number(r[measure])));\n    return [...totals.entries()].map(([label, value]) => ({ label, value }));\n  }\n\n  monthLabel(iso) {\n    const names = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];\n    return names[Number(iso.slice(5, 7)) - 1];\n  }\n\n  quarterLabel(iso) {\n    return 'Q' + (Math.floor((Number(iso.slice(5, 7)) - 1) / 3) + 1);\n  }\n\n  /* ---------- chart mounting ---------- */\n\n  chartRef(key, build) {\n    return el => {\n      if (!el || el.__plKey === key) return;\n      el.__plKey = key;\n      const go = () => {\n        const box = el.parentElement;\n        if (!window.Chart || !box || !box.clientHeight || !box.clientWidth || !el.isConnected) {\n          setTimeout(go, 60);\n          return;\n        }\n        window.Chart.defaults.font.family = 'Figtree, system-ui, sans-serif';\n        window.Chart.defaults.color = 'rgba(32,30,29,0.62)';\n        if (el.__plChart) el.__plChart.destroy();\n        el.__plChart = new window.Chart(el, build());\n        requestAnimationFrame(() => { if (el.__plChart) el.__plChart.resize(); });\n      };\n      go();\n    };\n  }\n\n  base(extra) {\n    const grid = { color: 'rgba(32,30,29,0.08)', drawBorder: false };\n    return Object.assign({\n      responsive: true,\n      maintainAspectRatio: false,\n      animation: { duration: 450 },\n      plugins: { legend: { display: false } },\n      scales: {\n        x: { grid: { display: false }, ticks: { font: { size: 12 } } },\n        y: { grid: grid, border: { display: false }, ticks: { font: { size: 12 } } }\n      }\n    }, extra || {});\n  }\n\n  legendOpts(position) {\n    return { legend: { display: true, position: position || 'bottom', labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: 'circle', padding: 16, font: { size: 12 } } } };\n  }\n\n  /* ---------- configs ---------- */\n\n  cfgRegionBar(limit) {\n    let data = this.sumBy(this.parse(this.csv.revenue), 'region', 'revenue')\n      .sort((a, b) => b.value - a.value);\n    if (limit) data = data.slice(0, limit);\n    return {\n      type: 'bar',\n      data: { labels: data.map(d => d.label), datasets: [{ label: 'Revenue', data: data.map(d => d.value), backgroundColor: this.palette[0], borderRadius: 10, maxBarThickness: 58 }] },\n      options: this.base()\n    };\n  }\n\n  cfgRepBar() {\n    const data = this.sumBy(this.parse(this.csv.revenue), 'rep', 'revenue')\n      .sort((a, b) => b.value - a.value).slice(0, 10);\n    return {\n      type: 'bar',\n      data: { labels: data.map(d => d.label), datasets: [{ label: 'Revenue', data: data.map(d => d.value), backgroundColor: this.palette[1], borderRadius: 10, maxBarThickness: 26 }] },\n      options: this.base({ indexAxis: 'y', scales: { y: { grid: { display: false }, border: { display: false }, ticks: { font: { size: 12 } } }, x: { grid: { color: 'rgba(32,30,29,0.08)' }, border: { display: false }, ticks: { font: { size: 12 } } } } })\n    };\n  }\n\n  cfgRegionDoughnut() {\n    const data = this.sumBy(this.parse(this.csv.revenue), 'region', 'revenue')\n      .sort((a, b) => b.value - a.value);\n    return {\n      type: 'doughnut',\n      data: { labels: data.map(d => d.label), datasets: [{ data: data.map(d => d.value), backgroundColor: this.palette, borderColor: '#f5ead8', borderWidth: 3, cutout: '58%' }] },\n      options: { responsive: true, maintainAspectRatio: false, plugins: this.legendOpts('right') }\n    };\n  }\n\n  cfgSignups() {\n    const rows = this.parse(this.csv.signups);\n    const data = this.sumBy(rows.map(r => ({ m: this.monthLabel(r.date), signups: r.signups })), 'm', 'signups');\n    return {\n      type: 'line',\n      data: { labels: data.map(d => d.label), datasets: [{ label: 'Signups', data: data.map(d => d.value), borderColor: this.palette[0], backgroundColor: 'rgba(198,113,57,0.14)', borderWidth: 3, tension: 0.38, fill: true, pointRadius: 3, pointBackgroundColor: this.palette[0] }] },\n      options: this.base()\n    };\n  }\n\n  cfgTraffic() {\n    const data = this.sumBy(this.parse(this.csv.traffic), 'source', 'sessions')\n      .sort((a, b) => b.value - a.value);\n    return {\n      type: 'doughnut',\n      data: { labels: data.map(d => d.label), datasets: [{ data: data.map(d => d.value), backgroundColor: this.palette, borderColor: '#f5ead8', borderWidth: 3, cutout: '56%' }] },\n      options: { responsive: true, maintainAspectRatio: false, plugins: this.legendOpts('right') }\n    };\n  }\n\n  cfgSalesStacked() {\n    const rows = this.parse(this.csv.sales);\n    const quarters = ['Q1', 'Q2', 'Q3', 'Q4'];\n    const cats = ['Hardware', 'Software', 'Services'];\n    const datasets = cats.map((cat, i) => ({\n      label: cat,\n      data: quarters.map(q => rows\n        .filter(r => r.category === cat && this.quarterLabel(r.date) === q)\n        .reduce((sum, r) => sum + Number(r.sales), 0)),\n      backgroundColor: this.palette[i],\n      borderRadius: 8,\n      maxBarThickness: 44\n    }));\n    return {\n      type: 'bar',\n      data: { labels: quarters, datasets: datasets },\n      options: this.base({\n        plugins: this.legendOpts('bottom'),\n        scales: {\n          x: { stacked: true, grid: { display: false }, ticks: { font: { size: 12 } } },\n          y: { stacked: true, grid: { color: 'rgba(32,30,29,0.08)' }, border: { display: false }, ticks: { font: { size: 12 } } }\n        }\n      })\n    };\n  }\n\n  cfgScatter() {\n    const rows = this.parse(this.csv.price);\n    return {\n      type: 'scatter',\n      data: { datasets: [{ label: 'Products', data: rows.map(r => ({ x: Number(r.price), y: Number(r.rating) })), backgroundColor: this.palette[0], pointRadius: 5 }] },\n      options: this.base({\n        scales: {\n          x: { grid: { color: 'rgba(32,30,29,0.08)' }, border: { display: false }, ticks: { font: { size: 12 } }, title: { display: true, text: 'Price' } },\n          y: { grid: { color: 'rgba(32,30,29,0.08)' }, border: { display: false }, ticks: { font: { size: 12 } }, title: { display: true, text: 'Rating' } }\n        }\n      })\n    };\n  }\n\n  cfgBubble() {\n    const rows = this.parse(this.csv.city);\n    return {\n      type: 'bubble',\n      data: { datasets: [{ label: 'Cities', data: rows.map(r => ({ x: Number(r.area_km2), y: Number(r.population_k), r: Math.max(4, Number(r.density_per_km2) / 900) })), backgroundColor: 'rgba(143,160,115,0.55)', borderColor: '#56633f', borderWidth: 1.5 }] },\n      options: this.base({\n        scales: {\n          x: { grid: { color: 'rgba(32,30,29,0.08)' }, border: { display: false }, ticks: { font: { size: 12 } }, title: { display: true, text: 'Area (km2)' } },\n          y: { grid: { color: 'rgba(32,30,29,0.08)' }, border: { display: false }, ticks: { font: { size: 12 } }, title: { display: true, text: 'Population (k)' } }\n        }\n      })\n    };\n  }\n\n  /* ---------- specs ---------- */\n\n  specs = {\n    byRegion: {\n      title: 'Revenue by region',\n      type: 'bar',\n      json: '{\\n  \"chartType\": \"bar\",\\n  \"title\": \"Revenue by region\",\\n  \"dimension\": { \"column\": \"region\" },\\n  \"measures\": [\\n    { \"column\": \"revenue\", \"aggregation\": \"sum\" }\\n  ],\\n  \"sort\": { \"by\": \"measure\", \"direction\": \"desc\" }\\n}'\n    },\n    byRep: {\n      title: 'Top ten reps by revenue',\n      type: 'horizontalBar',\n      json: '{\\n  \"chartType\": \"horizontalBar\",\\n  \"title\": \"Top ten reps by revenue\",\\n  \"dimension\": { \"column\": \"rep\" },\\n  \"measures\": [\\n    { \"column\": \"revenue\", \"aggregation\": \"sum\" }\\n  ],\\n  \"sort\": { \"by\": \"measure\", \"direction\": \"desc\" },\\n  \"limit\": 10\\n}'\n    },\n    share: {\n      title: 'Share of revenue by region',\n      type: 'doughnut',\n      json: '{\\n  \"chartType\": \"doughnut\",\\n  \"title\": \"Share of revenue by region\",\\n  \"dimension\": { \"column\": \"region\" },\\n  \"measures\": [\\n    { \"column\": \"revenue\", \"aggregation\": \"sum\" }\\n  ],\\n  \"sort\": { \"by\": \"measure\", \"direction\": \"desc\" }\\n}'\n    },\n    top3: {\n      title: 'Revenue by region, top three',\n      type: 'bar',\n      json: '{\\n  \"chartType\": \"bar\",\\n  \"title\": \"Revenue by region, top three\",\\n  \"dimension\": { \"column\": \"region\" },\\n  \"measures\": [\\n    { \"column\": \"revenue\", \"aggregation\": \"sum\" }\\n  ],\\n  \"sort\": { \"by\": \"measure\", \"direction\": \"desc\" },\\n  \"limit\": 3\\n}'\n    }\n  };\n\n  cfgForSpec(key) {\n    if (key === 'byRep') return this.cfgRepBar();\n    if (key === 'share') return this.cfgRegionDoughnut();\n    if (key === 'top3') return this.cfgRegionBar(3);\n    return this.cfgRegionBar();\n  }\n\n  /* ---------- navigation ---------- */\n\n  go(screen, spec) {\n    return () => {\n      const next = { screen: screen };\n      if (spec) next.spec = spec;\n      this.setState(next);\n      if (window.scrollTo) window.scrollTo(0, 0);\n    };\n  }\n\n  simulate(from, to, spec) {\n    return () => {\n      const delay = this.props.demoDelay ?? 1400;\n      this.setState({ screen: from });\n      if (window.scrollTo) window.scrollTo(0, 0);\n      clearTimeout(this._t);\n      this._t = setTimeout(() => this.setState(spec ? { screen: to, spec: spec } : { screen: to }), delay);\n    };\n  }\n\n  componentWillUnmount() { clearTimeout(this._t); }\n\n  renderVals() {\n    const screen = this.state.screen;\n    const spec = this.specs[this.state.spec] || this.specs.byRegion;\n    const cols = this.props.galleryColumns ?? 3;\n\n    const tabs = [\n      ['landing', 'Landing'], ['upload', 'Upload'], ['parsing', 'Parsing'],\n      ['suggestions', 'Suggestions'], ['thinking', 'Thinking'], ['chart', 'Chart'],\n      ['shared', 'Shared link'], ['rejected', 'Rejected file'], ['empty', 'Empty result']\n    ].map(([key, label]) => ({\n      label: label,\n      go: this.go(key),\n      style: key === screen\n        ? 'font-size: 13px; background: var(--color-accent); color: var(--color-bg);'\n        : 'font-size: 13px; border-color: var(--color-divider); color: var(--color-text);'\n    }));\n\n    const gallery = [\n      ['revenue-by-region', 'Revenue by region', 'bar', 'Total sales revenue per region, ranked highest first.', () => this.cfgRegionBar()],\n      ['monthly-signups', 'Signups per month', 'line', 'New account signups aggregated by month across the year.', () => this.cfgSignups()],\n      ['traffic-sources', 'Traffic by source', 'doughnut', 'Share of sessions contributed by each acquisition channel.', () => this.cfgTraffic()],\n      ['sales-by-category', 'Sales by category per quarter', 'stacked bar', 'Quarterly sales stacked by product category.', () => this.cfgSalesStacked()],\n      ['price-vs-rating', 'Price against rating', 'scatter', 'Every product plotted by list price and average customer rating.', () => this.cfgScatter()],\n      ['city-size-vs-density', 'City size against density', 'bubble', 'City area against population, sized by people per square kilometre.', () => this.cfgBubble()]\n    ].map(([slug, title, type, desc, build]) => ({\n      slug: slug, title: title, type: type, desc: desc,\n      chart: this.chartRef('g-' + slug, build)\n    }));\n\n    const suggestions = [\n      ['byRegion', 1, 'Revenue by region', 'bar', 'Five regions and one numeric column: a ranked bar is the clearest read on who is ahead.', () => this.cfgRegionBar()],\n      ['byRep', 2, 'Top ten reps by revenue', 'horizontalBar', 'Twelve reps with long names, so lay the bars sideways and keep the top ten.', () => this.cfgRepBar()],\n      ['share', 3, 'Share of revenue by region', 'doughnut', 'Few categories summing to a meaningful total, which is the part-to-whole case.', () => this.cfgRegionDoughnut()]\n    ].map(([key, n, title, type, why, build]) => ({\n      n: n, title: title, type: type, why: why,\n      chart: this.chartRef('s-' + key, build),\n      go: this.simulate('thinking', 'chart', key)\n    }));\n\n    const order = ['byRegion', 'byRep', 'share', 'top3'];\n    const nextKey = order[(order.indexOf(this.state.spec) + 1) % order.length];\n\n    const refineChips = [\n      ['Split it by rep', 'byRep'],\n      ['Show shares instead', 'share'],\n      ['Top three only', 'top3'],\n      ['Back to regions', 'byRegion']\n    ].map(([label, key]) => ({ label: label, go: this.go('chart', key) }));\n\n    return {\n      isLanding: screen === 'landing',\n      isUpload: screen === 'upload',\n      isParsing: screen === 'parsing',\n      isSuggestions: screen === 'suggestions',\n      isThinking: screen === 'thinking',\n      isChart: screen === 'chart',\n      isShared: screen === 'shared',\n      isRejected: screen === 'rejected',\n      isEmpty: screen === 'empty',\n\n      screenTabs: (this.props.showScreenBar ?? true) ? tabs : [],\n      gallery: gallery,\n      galleryTracks: 'repeat(' + cols + ', minmax(0, 1fr))',\n      suggestions: suggestions,\n      refineChips: refineChips,\n\n      chartTitle: spec.title,\n      specJson: spec.json,\n\n      heroChart: this.chartRef('hero', () => this.cfgSignups()),\n      mainChart: this.chartRef('main-' + this.state.spec, () => this.cfgForSpec(this.state.spec)),\n      shareChart: this.chartRef('share-' + this.state.spec, () => this.cfgForSpec(this.state.spec)),\n\n      goLanding: this.go('landing'),\n      goUpload: this.go('upload'),\n      goSuggestions: this.go('suggestions'),\n      goChart: this.go('chart'),\n      goShared: this.go('shared'),\n      goRejected: this.go('rejected'),\n      goThinking: this.simulate('thinking', 'chart'),\n      startUpload: this.simulate('parsing', 'suggestions'),\n      nextSpec: this.go('chart', nextKey)\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
