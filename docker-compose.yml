name: plotlineai

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plotlineai}
      POSTGRES_USER: ${POSTGRES_USER:-plotlineai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plotlineai}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-plotlineai} -d ${POSTGRES_DB:-plotlineai}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - internal

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-plotlineai}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-plotlineai}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-plotlineai}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - internal

  web:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: "http://api:8080"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # inert for the rewrite (destination baked at image build via build.args); kept for a future runtime proxy
      BACKEND_INTERNAL_URL: http://api:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5-nano}
      AI_DAILY_CALL_LIMIT: ${AI_DAILY_CALL_LIMIT:-500}
      RATE_LIMIT_CLIENT_BURST: ${RATE_LIMIT_CLIENT_BURST:-10}
      RATE_LIMIT_CLIENT_REFILL_MS: ${RATE_LIMIT_CLIENT_REFILL_MS:-6000}
      RATE_LIMIT_GLOBAL_BURST: ${RATE_LIMIT_GLOBAL_BURST:-30}
      RATE_LIMIT_GLOBAL_REFILL_MS: ${RATE_LIMIT_GLOBAL_REFILL_MS:-2000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - internal

volumes:
  db-data:

networks:
  internal:
    driver: bridge
