name: plotlineai

# Every service: no privilege escalation through setuid binaries.
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true

services:
  # Local stand-ins for AWS, so the stack runs with no AWS account: DynamoDB Local (in memory,
  # so a restart starts empty) and S3Mock. aws-init creates what CDK creates on AWS.
  dynamodb:
    <<: *hardened
    image: amazon/dynamodb-local:3.3.1
    restart: unless-stopped
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    networks:
      - internal

  s3:
    <<: *hardened
    image: adobe/s3mock:5.2.3
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: plotlineai-data
    networks:
      - internal

  aws-init:
    <<: *hardened
    image: amazon/aws-cli:2.37.6
    entrypoint: ["sh", "/init-aws.sh"]
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    volumes:
      - ./deploy/local/init-aws.sh:/init-aws.sh:ro
    depends_on:
      - dynamodb
      - s3
    networks:
      - internal

  api:
    <<: *hardened
    build:
      context: ./backend
    restart: unless-stopped
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      AWS_REGION: us-east-1
      # Neither stand-in checks credentials, but the SDK wants some.
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      PLOTLINEAI_DYNAMODB_ENDPOINT: http://dynamodb:8000
      PLOTLINEAI_S3_ENDPOINT: http://s3:9090
      # Where the browser PUTs uploads: Caddy's /local-s3 route to S3Mock, same origin as the app.
      PLOTLINEAI_S3_PUBLIC_ENDPOINT: http://localhost:3000/local-s3
      AI_DAILY_CALL_LIMIT: ${AI_DAILY_CALL_LIMIT:-500}
      UPLOAD_DAILY_LIMIT: ${UPLOAD_DAILY_LIMIT:-300}
      DATASET_TTL: ${DATASET_TTL:-PT24H}
    depends_on:
      aws-init:
        condition: service_completed_successfully
    healthcheck:
      # The management port: never published, and not reachable through web.
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - internal

  web:
    <<: *hardened
    build:
      context: ./frontend
    restart: unless-stopped
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1001,gid=1001
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://api:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # No OPENAI_BASE_URL here: @ai-sdk/openai reads it itself and rejects an empty value,
      # so it must be absent, not blank. docker-compose.e2e.yml sets it for the stub.
      AI_MODEL: ${AI_MODEL:-gpt-5-nano}
      # Behind Caddy, the client address is the right-most X-Forwarded-For entry.
      CLIENT_IP_SOURCE: xff
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # Rate-limit counters live in DynamoDB Local, as they live in DynamoDB on AWS.
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      RATE_LIMIT_TABLE: plotlineai-rate-limits
      RATE_LIMIT_AI_CLIENT_LIMIT: ${RATE_LIMIT_AI_CLIENT_LIMIT:-10}
      RATE_LIMIT_AI_GLOBAL_LIMIT: ${RATE_LIMIT_AI_GLOBAL_LIMIT:-30}
      RATE_LIMIT_WRITE_CLIENT_LIMIT: ${RATE_LIMIT_WRITE_CLIENT_LIMIT:-8}
      RATE_LIMIT_WRITE_GLOBAL_LIMIT: ${RATE_LIMIT_WRITE_GLOBAL_LIMIT:-60}
      RATE_LIMIT_RENDER_CLIENT_LIMIT: ${RATE_LIMIT_RENDER_CLIENT_LIMIT:-30}
      RATE_LIMIT_RENDER_GLOBAL_LIMIT: ${RATE_LIMIT_RENDER_GLOBAL_LIMIT:-1200}
    # No published port: proxy is the only way in.
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - internal

  proxy:
    <<: *hardened
    image: caddy:2-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "3000:80"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - internal

volumes:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
