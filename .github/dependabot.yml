version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node major in the Dockerfiles; bump both together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: typescript
        versions: [">=7"]
      # eslint-plugin-react crashes under ESLint 10.
      - dependency-name: eslint
        versions: [">=10"]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node major in the Dockerfiles; bump both together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /infra
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node major in the Dockerfiles; bump both together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/frontend, /backend, /e2e/ai-stub]
    schedule:
      interval: weekly
    ignore:
      # Odd Node majors are never LTS and reach end of life within months.
      - dependency-name: node
        versions: ["25.x", "27.x", "29.x", "31.x"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
