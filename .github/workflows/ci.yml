name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: mvn verify
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install
        working-directory: frontend
        run: npm ci
      - name: dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: lint
        working-directory: frontend
        run: npm run lint
      - name: typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: unit tests
        working-directory: frontend
        run: npm test
      - name: build
        working-directory: frontend
        run: npm run build

  # The whole stack under compose, with e2e/ai-stub standing in for OpenAI. Building the
  # images here is also what proves both Dockerfiles still build.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: seed env
        run: cp .env.example .env
      - name: start the stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
      - name: install
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: typecheck
        working-directory: e2e
        run: npm run typecheck
      - name: playwright
        working-directory: e2e
        run: npx playwright test
      - name: service logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color
      - name: upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # Known vulnerabilities in what actually ships: each image's OS packages and every
  # library inside it (the api's jar included). Fails on HIGH or CRITICAL with a fix out.
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [web, api]
    steps:
      - uses: actions/checkout@v7
      - name: seed env
        run: cp .env.example .env
      - name: build
        run: docker compose build ${{ matrix.service }}
      - name: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: plotlineai-${{ matrix.service }}:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # The CDK app: assertion tests, then a full synth, which fails on any cdk-nag finding not
  # acknowledged with a reason. Synth needs the built Lambda code; no AWS credentials exist here.
  infra:
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            infra/package-lock.json
      - name: api Lambda zip
        working-directory: backend
        run: ./mvnw -B package -DskipTests
      - name: web Lambda bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run build:lambda
      - name: install
        working-directory: infra
        run: npm ci
      - name: Lambda bundles
        working-directory: infra
        run: npm run build:lambda
      - name: typecheck
        working-directory: infra
        run: npm run typecheck
      - name: tests
        working-directory: infra
        run: npm test
      - name: synth
        working-directory: infra
        run: npx cdk synth --no-notices -c alertEmail=ci@example.com > /dev/null

  # Known vulnerabilities in the code the Lambda functions run: the api's jars and web's
  # node_modules. rootfs mode reads built artifacts (fs mode skips jars).
  scan-artifacts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        function: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        if: matrix.function == 'api'
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v7
        if: matrix.function == 'web'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: api Lambda zip
        if: matrix.function == 'api'
        run: |
          (cd backend && ./mvnw -B package -DskipTests)
          mkdir -p bundle && unzip -q backend/target/backend-lambda.zip -d bundle
      - name: web Lambda bundle
        if: matrix.function == 'web'
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run build:lambda
          mv .lambda ../bundle
      - name: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: rootfs
          scan-ref: bundle
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
