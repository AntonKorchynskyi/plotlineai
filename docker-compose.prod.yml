# Production overlay for a single VPS. A stub: enough to run the stack on a real domain
# with TLS, not a deploy pipeline.
#
#   DOMAIN=charts.example.com docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Needs DNS for DOMAIN pointing at the box, ports 80 and 443 open, and a real
# POSTGRES_PASSWORD and OPENAI_API_KEY in .env. Caddy provisions and renews the
# certificate itself, and keeps it in the caddy-data volume.

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    deploy:
      resources:
        limits:
          memory: 768m

  api:
    environment:
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    deploy:
      resources:
        limits:
          memory: 1g

  web:
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
    deploy:
      resources:
        limits:
          memory: 512m

  proxy:
    environment:
      SITE_ADDRESS: ${DOMAIN:?set DOMAIN to the site's hostname}
    # Replaces the base file's 3000:80 rather than adding to it.
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/hsts.caddy:/etc/caddy/site.d/hsts.caddy:ro
    deploy:
      resources:
        limits:
          memory: 128m
